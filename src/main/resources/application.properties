spring.application.name=tech-user-service

server.port=${SERVER_PORT:8001}

# --- Datasource (secrets only via env) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA: schema managed by Flyway, never auto-update in prod ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=true

# --- JWT (secret only via env in prod) ---
jwt.secret=${JWT_SECRET:5A7C3F9D2E6B8A1C4F7D0E3B9A2C5F8D1E4B7A0C3F6D9B2E5A8C1F4D7B0E3A6}
jwt.access-token-expiration-ms=${JWT_ACCESS_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_MS:86400000}

# --- Actuator / observability ---
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}
management.endpoint.health.probes.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.info.env.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.metrics.enable.all=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.prometheus.metrics.export.enabled=true

info.app.name=${spring.application.name}
info.app.description=User management microservice
info.app.version=@project.version@

# --- CORS (origins via env, comma-separated) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# --- Logging (MDC: traceId/userId подставляет logback-spring.xml) ---
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.kov.techuserservice=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-} userId=%X{userId:-}] [%thread] %logger{36} - %msg%n

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Группы видны как /v3/api-docs/users, /v3/api-docs/auth, /v3/api-docs/addresses, /v3/api-docs/actuator
springdoc.group-configs[0].group=users
springdoc.group-configs[0].paths-to-match=/api/users/**
springdoc.group-configs[1].group=auth
springdoc.group-configs[1].paths-to-match=/api/auth/**
springdoc.group-configs[2].group=addresses
springdoc.group-configs[2].paths-to-match=/api/users/*/addresses/**
springdoc.group-configs[3].group=actuator
springdoc.group-configs[3].paths-to-match=/actuator/**
